# This file is used by `render workflows init` to scaffold new projects.
# It tells the CLI how to display this template and what instructions to show
# after scaffolding. You can safely ignore it when using this example directly.

name: Pi coding agent
description: Pi coding agent that clones a repo, fixes a support ticket, and returns a patch or pushes a branch

workflowsRoot: .

renderBuildCommand: npm install && npm run build
renderStartCommand: node dist/main.js

nextSteps:
  - label: Enter your project directory
    command: cd {{dir}}
  - label: Add your Anthropic API key
    command: cp .env.example .env
    hint: Then set ANTHROPIC_API_KEY in .env. GITHUB_TOKEN is only needed to push branches. The local task server loads .env when it starts, so do this first.
  - label: Build the project
    command: npm run build
  - label: Start your local task server
    command: render workflows dev -- {{startCommand}}
    hint: This runs your workflow service locally, allowing you to view and run tasks without deploying to Render.
  - label: Fix a ticket in the sample app (in another terminal)
    command: "render workflows tasks runs start runPi --local --input='[{\"repoUrl\": \"https://github.com/render-examples/render-workflows-examples-ts\", \"subdir\": \"pi-agent/sample-app\", \"ticket\": {\"id\": \"TCK-1001\", \"account_id\": \"ACC-100\", \"order_id\": \"ORD-2001\", \"subject\": \"Charged twice for my order\", \"body\": \"I was charged two times for order ORD-2001 yesterday. Please fix this.\"}}]'"
    hint: Pi clones the repository, fixes the bug behind the ticket, and returns the change as a patch you can apply with git apply.
  - label: Deploy your workflow service to Render
    hint: |
      To deploy this workflow to Render, first push this code to a remote repository. Then, create a workflow service from your Render Dashboard, connect it to your repository, and provide the following build and start commands:
      • Build command: {{renderBuildCommand}}
      • Start command: {{renderStartCommand}}
      Set ANTHROPIC_API_KEY (and optionally ANTHROPIC_MODEL and GITHUB_TOKEN) as environment variables during service creation.
